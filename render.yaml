services:
  # SkillTrace FastAPI Backend Web Service
  - type: web
    name: skilltrace-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skilltrace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  # SkillTrace PostgreSQL Managed Database
  - name: skilltrace-db
    databaseName: skilltrace
    user: skilltrace
    plan: free
