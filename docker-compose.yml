services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skilltrace
      POSTGRES_USER: skilltrace
      POSTGRES_PASSWORD: skilltrace
    ports:
      - "5432:5432"
    volumes:
      - skilltrace_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilltrace -d skilltrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://skilltrace:skilltrace@db:5432/skilltrace
      JWT_SECRET: local-demo-secret-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      CORS_ORIGINS: '["http://localhost:3000"]'
      AUTO_CREATE_TABLES: "true"
      AUTO_SEED_DEMO: "true"
    ports:
      - "8000:8000"
    volumes:
      - skilltrace_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  skilltrace_postgres:
  skilltrace_uploads:
